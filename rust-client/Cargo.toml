[package]
name = "jawl-companion-client"
version = "0.1.0"
edition = "2021"
description = "Native Rust client: stack launcher, mic owner (phase B), OBS presentation window"

[dependencies]
# Minimal, well-maintained building blocks only.
cpal = "0.15"           # cross-platform audio capture/playback (WASAPI on Windows)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }   # tiny blocking HTTP client
ctrlc = "3"             # clean shutdown on Ctrl+C
base64 = "0.22"
# OBS presentation window: WebView2 (ships with Windows) hosting the
# presentation origin. ADR-045: the 3D VRM avatar lives in the Electron
# desktop shell (desktop/); Mocari/Live2D is removed.
tao = "0.35"
wry = "0.50"
windows = { version = "0.48", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = 2
lto = "thin"
