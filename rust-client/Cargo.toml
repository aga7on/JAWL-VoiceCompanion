[package]
name = "jawl-companion-client"
version = "0.1.0"
edition = "2021"
description = "Native Rust client: owns audio devices, hosts Live2D avatar + window + OBS"

[dependencies]
# Minimal, well-maintained building blocks only.
cpal = "0.15"           # cross-platform audio capture/playback (WASAPI on Windows)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }   # tiny blocking HTTP client
winit = "0.29"          # windowing for the character window
ctrlc = "3"             # clean shutdown on Ctrl+C

[profile.release]
opt-level = 2
lto = "thin"
