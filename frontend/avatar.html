<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAWL Avatar</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; color: #f1f3f5; }
    #surface { position: relative; width: 100%; height: 100%; min-width: 240px; min-height: 240px; }
    #live2d-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #avatar { position: absolute; left: 50%; bottom: 7%; width: min(46vw, 360px); aspect-ratio: 3 / 4; transform: translateX(-50%); }
    #head { position: absolute; left: 17%; top: 2%; width: 66%; aspect-ratio: 1; border: 4px solid #b8d8ff; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #4a536d 0 18%, #283044 48%, #17202f 100%); box-shadow: 0 0 28px #78aef477; }
    #head::before { content: ''; position: absolute; left: 24%; top: 14%; width: 52%; height: 16%; border-radius: 50%; background: #b8d8ff33; transform: rotate(-12deg); }
    .eye { position: absolute; top: 42%; width: 13%; height: 14%; border: 2px solid #d8ecff; border-radius: 50%; background: #eef8ff; box-shadow: 0 0 10px #d8ecff; animation: blink 5.2s infinite; }
    .eye::after { content: ''; position: absolute; left: 34%; top: 25%; width: 42%; height: 52%; border-radius: 50%; background: #293651; }
    .eye-left { left: 24%; }
    .eye-right { right: 24%; }
    #mouth { --lip-sync: 0; --mouth-rotation: 0deg; position: absolute; left: 38%; top: 64%; width: 24%; height: 8%; border-bottom: 3px solid #d8ecff; border-radius: 0 0 50% 50%; transform: rotate(var(--mouth-rotation)) scaleY(calc(.88 + var(--lip-sync))); transform-origin: center; transition: all .18s ease; }
    .cheek { position: absolute; top: 59%; width: 13%; height: 6%; border-radius: 50%; background: #ff9eb855; opacity: 0; transition: opacity .18s ease; }
    .cheek-left { left: 13%; }
    .cheek-right { right: 13%; }
    #body { position: absolute; left: 7%; right: 7%; bottom: 0; height: 58%; border: 4px solid #88baff; border-bottom: 0; border-radius: 48% 48% 0 0; background: linear-gradient(135deg, #273a63, #151b2d 72%); box-shadow: 0 0 30px #5a9dff55; }
    #badge { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); padding: 5px 10px; border: 1px solid #a9d4ff88; border-radius: 999px; background: #121827cc; color: #cde5ff; font-size: clamp(10px, 1.4vw, 14px); letter-spacing: 0.08em; white-space: nowrap; }
    #subtitle { position: absolute; left: 50%; bottom: 1.5%; width: min(92vw, 720px); transform: translateX(-50%); padding: 8px 12px; border: 1px solid #9eb9d766; border-radius: 10px; background: #101522d9; text-align: center; font-size: clamp(12px, 1.8vw, 20px); line-height: 1.3; }
    #debug { position: absolute; left: 8px; top: 8px; padding: 5px 8px; border-radius: 6px; background: #101522dd; color: #b5c2d6; font-size: 11px; }
    .hidden { display: none; }
    .state-listening #head { box-shadow: 0 0 34px #b7e7ffcc; }
    .state-thinking #head { animation: thinking 1.4s ease-in-out infinite; }
    .state-speaking #badge { color: #fff1bc; border-color: #ffe49a; }
    .state-speaking #mouth { animation: talk .16s ease-in-out infinite alternate; }
    .state-speaking.lip-sync-active #mouth { animation: none; }
    .expression-concerned #head { filter: hue-rotate(295deg) saturate(0.8); }
    .expression-confused #head { filter: hue-rotate(35deg) saturate(1.15); }
    .expression-happy #mouth { height: 15%; border-bottom-width: 4px; border-radius: 0 0 60% 60%; }
    .expression-happy .cheek, .expression-surprised .cheek { opacity: 1; }
    .expression-sad #mouth { top: 70%; border-bottom: 0; border-top: 3px solid #d8ecff; border-radius: 50% 50% 0 0; }
    .expression-angry .eye { transform: rotate(12deg); }
    .expression-angry #mouth { width: 30%; left: 35%; border-bottom-color: #ff9eae; }
    .expression-surprised #mouth { width: 14%; height: 14%; left: 43%; border: 3px solid #d8ecff; border-radius: 50%; }
    .expression-confused #mouth { --mouth-rotation: -8deg; }
    .expression-concerned #mouth { width: 18%; left: 41%; }
    @keyframes blink { 0%, 46%, 49%, 100% { transform: scaleY(1); } 47%, 48% { transform: scaleY(.08); } }
    @keyframes talk { from { transform: scaleY(.65); } to { transform: scaleY(1.35); } }
    @keyframes thinking { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  </style>
</head>
<body>
  <div id="surface" aria-label="Прозрачная поверхность 2D-компаньона">
    <canvas id="live2d-canvas" class="hidden"></canvas>
    <div id="avatar" class="expression-neutral">
      <div id="head">
        <span class="eye eye-left"></span>
        <span class="eye eye-right"></span>
        <span class="cheek cheek-left"></span>
        <span class="cheek cheek-right"></span>
        <span id="mouth"></span>
      </div>
      <div id="body"></div>
      <div id="badge">2D FALLBACK</div>
    </div>
    <div id="subtitle" role="status"></div>
    <div id="debug" class="hidden"></div>
  </div>
  <script>
    const avatar = document.querySelector('#avatar');
    const canvas = document.querySelector('#live2d-canvas');
    const subtitle = document.querySelector('#subtitle');
    const debug = document.querySelector('#debug');
    const mouth = document.querySelector('#mouth');
    const showDebug = new URLSearchParams(window.location.search).get('debug') === '1';
    const presentationToken = new URLSearchParams(window.location.search).get('token') || '';
    function presentationUrl(path) {
      if (!presentationToken) return path;
      const separator = path.includes('?') ? '&' : '?';
      return `${path}${separator}token=${encodeURIComponent(presentationToken)}`;
    }
    const expressionFallbacks = {
      neutral: 'neutral', attentive: 'attentive', concerned: 'concerned', confused: 'confused',
      happy: 'happy', sad: 'sad', angry: 'angry', surprised: 'surprised'
    };
    let live2d = null;
    let runtimeCapabilities = {expression: false, motion: false, lip_sync: false};
    let live2dError = '';
    let audioAmplitude = 0;
    let audioSpeaking = false;
    let audioTimestamp = 0;
    let audioReceivedAt = 0;
    let avatarAudioChannel = null;
    if (showDebug) debug.classList.remove('hidden');

    // Wheel zoom and left-button drag pan over the whole avatar surface.
    // OBS ignores mouse input unless "interact" is enabled, so this only
    // affects interactive viewers (the main panel embed and interact mode).
    // With Live2D the model re-renders at the zoomed scale (no blur); the
    // CSS fallback avatar is vector and scales cleanly. Subtitles stay fixed.
    const surface = document.getElementById('surface');
    const fallbackAvatar = document.getElementById('avatar');
    let viewScale = 1, panX = 0, panY = 0;
    function applyView() {
      if (live2d && typeof live2d.setView === 'function') {
        try { live2d.setView({zoom: viewScale, panX, panY}); } catch (_) { /* keep going */ }
      } else {
        fallbackAvatar.style.transform =
          `translate(calc(-50% + ${panX.toFixed(1)}px), ${panY.toFixed(1)}px) scale(${viewScale.toFixed(3)})`;
      }
      surface.style.cursor = 'grab';
    }
    function resetView() {
      viewScale = 1; panX = 0; panY = 0;
      if (live2d && typeof live2d.setView === 'function') {
        try { live2d.setView({zoom: 1, panX: 0, panY: 0}); } catch (_) {}
      }
      fallbackAvatar.style.transform = '';
      surface.style.cursor = 'grab';
    }
    window.addEventListener('wheel', (event) => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.12 : 1 / 1.1;
      viewScale = Math.min(3, Math.max(0.4, viewScale * factor));
      applyView();
    }, {passive: false});
    let viewDrag = null;
    window.addEventListener('mousedown', (event) => {
      if (event.button !== 0) return;
      viewDrag = {x: event.clientX, y: event.clientY};
      surface.style.cursor = 'grabbing';
      event.preventDefault();
    });
    window.addEventListener('mousemove', (event) => {
      if (!viewDrag) return;
      panX += event.clientX - viewDrag.x;
      panY += event.clientY - viewDrag.y;
      viewDrag = {x: event.clientX, y: event.clientY};
      applyView();
    });
    window.addEventListener('mouseup', () => {
      viewDrag = null;
      surface.style.cursor = 'grab';
    });
    window.addEventListener('mouseleave', () => { viewDrag = null; });
    window.addEventListener('dblclick', resetView);
    surface.style.cursor = 'grab';

    function safeExpression(value) {
      const name = String(value || 'neutral').toLowerCase().replace(/[^a-z0-9_-]/g, '');
      return expressionFallbacks[name] || 'neutral';
    }
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Live2D runtime не загрузился'));
        document.head.appendChild(script);
      });
    }
    function acceptAudioEvent(event) {
      if (!event || event.schema_version !== 1 || event.type !== 'avatar.audio') return;
      const amplitude = Number(event.amplitude);
      const timestamp = Number(event.timestamp_ms) || 0;
      if (!Number.isFinite(amplitude) || amplitude < 0 || amplitude > 1 || typeof event.speaking !== 'boolean') return;
      if (audioTimestamp && (!timestamp || timestamp < audioTimestamp)) return;
      audioAmplitude = amplitude;
      audioSpeaking = event.speaking;
      audioTimestamp = timestamp;
      audioReceivedAt = performance.now();
      applyLipSync();
    }
    function applyLipSync() {
      const fresh = audioSpeaking && performance.now() - audioReceivedAt <= 900;
      const amplitude = fresh ? audioAmplitude : 0;
      mouth.style.setProperty('--lip-sync', (amplitude * 0.7).toFixed(3));
      return {fresh, amplitude};
    }
    try {
      avatarAudioChannel = new BroadcastChannel('jawl-voicecompanion-avatar');
      avatarAudioChannel.onmessage = event => acceptAudioEvent(event.data);
    } catch (_) { /* /api/state polling remains available */ }
    async function mountLive2D() {
      try {
        const response = await fetch(presentationUrl('/api/presentation/config'), {cache: 'no-store'});
        const config = await response.json();
        if (!config.ready) {
          if (showDebug) {
            const warnings = (config.validation?.warnings || []).join(', ');
            const missing = (config.validation?.missing || []).length;
            debug.textContent = config.enabled
              ? `Live2D fallback · model is not renderable${missing ? ` · missing: ${missing}` : ''}${warnings ? ` · ${warnings}` : ''}`
              : 'Live2D fallback · asset bundle is not configured';
          }
          return;
        }
        await loadScript(config.runtime_url);
        const factory = window.Live2DCompanionRuntime?.create;
        if (typeof factory !== 'function') throw new Error('runtime не предоставил Live2DCompanionRuntime.create');
        live2d = await factory({canvas, modelUrl: config.model_url});
        if (!live2d) throw new Error('runtime не создал модель');
        runtimeCapabilities = {
          expression: typeof live2d.setExpression === 'function',
          motion: typeof live2d.setMotion === 'function',
          lip_sync: typeof live2d.setLipSync === 'function'
        };
        avatar.classList.add('hidden');
        canvas.classList.remove('hidden');
      } catch (error) {
        live2dError = error.message || 'Live2D runtime недоступен';
        if (showDebug) debug.textContent = `Live2D fallback · ${live2dError}`;
      }
    }

    function render(state) {
      const response = {
        text: state.subtitle || '',
        speak: state.speak === true,
        emotion: state.emotion || {},
        avatar: state.avatar || {state: 'idle', expression: 'neutral'}
      };
      const avatarState = response.avatar;
      const expression = safeExpression(avatarState.expression || response.emotion?.id);
      const backendAudio = state.avatar_audio;
      if (backendAudio) acceptAudioEvent({...backendAudio, type: 'avatar.audio'});
      const lipSync = applyLipSync();
      avatar.className = `${live2d ? 'hidden ' : ''}expression-${expression} state-${String(avatarState.state || 'idle').replace(/[^a-z0-9_-]/gi, '')}${lipSync.fresh ? ' lip-sync-active' : ''}`;
      subtitle.textContent = response.speak ? String(response.text || '').slice(0, 280) : '';
      if (live2d) {
        try {
          live2d.setExpression?.(expression, Number(response.emotion?.intensity || 0));
          live2d.setMotion?.(String(avatarState.motion || 'idle'));
          live2d.setLipSync?.(lipSync.amplitude);
        } catch (error) {
          live2d.setExpression?.('neutral', 0);
          if (showDebug) debug.textContent = `Live2D neutral fallback · ${error.message}`;
        }
      }
      if (showDebug) {
        const runtime = live2d
          ? `Live2D e:${runtimeCapabilities.expression ? 'on' : 'off'} m:${runtimeCapabilities.motion ? 'on' : 'off'} l:${runtimeCapabilities.lip_sync ? 'on' : 'off'}`
          : '2D fallback';
        debug.textContent = `${avatarState.state || 'idle'} · ${expression} · ${runtime} · isolated presentation`;
      }
    }

    async function refresh() {
      try {
        const response = await fetch(presentationUrl('/api/presentation/state'), {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        if (showDebug) debug.textContent = `backend unavailable · ${error.message}`;
      }
    }
    mountLive2D();
    refresh();
    window.setInterval(refresh, 250);
  </script>
</body>
</html>
