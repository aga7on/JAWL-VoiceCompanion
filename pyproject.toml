[project]
name = "jawl-voicecompanion"
version = "0.1.0"
description = "Local-first Russian AI companion with a 2D avatar and HostOS controls"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"jawl_voicecompanion/frontend" = ["frontend/*.html", "frontend/*.js"]

[project.optional-dependencies]
system-audio = ["PyAudioWPatch==0.2.12.8; platform_system == 'Windows'"]
test = ["aiohttp==3.14.1", "pytest==9.1.1"]

[project.scripts]
jawl-voicecompanion = "jawl_voicecompanion.__main__:main"
