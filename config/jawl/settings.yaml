# Owned baseline for the connected daily scenario. Provider credentials are external.
identity:
  agent_name: Компаньон
llm:
  main_model: ea07de5ddbf7bac67aee9db5d525e9ea830e9e0d:2
  available_models: [ea07de5ddbf7bac67aee9db5d525e9ea830e9e0d:2]
  language: ru
  is_multimodal: false
  tool_transport: json_envelope
  max_react_steps: 8
  provider:
    kind: openai_compatible
    display_name: LM Studio (local owned baseline)
    request_timeout_seconds: 120
system:
  timezone: 3
  heartbeat_interval: 600
  continuous_cycle: false
  proactive_guidance: false
  context_depth:
    budget:
      enabled: true
      skill_policy: adaptive
      skills_max_chars: 6000
      max_dynamic_chars: 12000
      recent_ticks_max_chars: 6000
      provider_max_chars: 8000
  goal_mode:
    enabled: false
    task_ledger_enabled: false
  lifecycle_hooks:
    enabled: false
  swarm:
    enabled: false
  tree_of_thoughts:
    enabled: false
  subconscious:
    enabled: false
  event_acceleration:
    # A user voice/chat turn must preempt an autonomous heartbeat. Deferring
    # here lets a slow provider monopolize the single JAWL ReAct lane and makes
    # live voice appear hung; the native arbiter preserves cancellation state.
    active_cycle_policy: interrupt
    queue_max_events: 100
    coalesce_window_sec: 2.0
    coalesce_payload_samples: 3
    critical_multiplier: 0.0
